<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
  />
  <title>DeepSeek 余额卡片</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <div id="app">
    <div id="card" class="card hidden">
      <div class="card-header">
        <div class="brand">
          <span class="brand-logo">DS</span>
          <span class="brand-name">DeepSeek 余额</span>
        </div>
        <div class="header-actions">
          <button id="btn-refresh" class="icon-btn" title="立即刷新">⟳</button>
          <div class="mode-switch">
            <button id="btn-mode" class="icon-btn" title="切换形态">▾</button>
            <div id="mode-menu" class="mode-menu hidden">
              <button type="button" data-mode="card">完整卡片</button>
              <button type="button" data-mode="mini">迷你卡片</button>
              <button type="button" data-mode="dot">小圆点</button>
            </div>
          </div>
          <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
        </div>
      </div>

      <div class="card-body">
        <div class="balance-row">
          <div id="balance-main" class="balance-main">--</div>
        </div>
      </div>

      <div class="card-footer">
        <span id="status-dot" class="status-dot"></span>
        <span id="updated-at" class="updated-at"></span>
      </div>
    </div>

    <div id="settings" class="card settings hidden">
      <div class="card-header">
        <div class="brand">
          <span class="brand-name">设置</span>
        </div>
        <div class="header-actions">
          <button id="btn-back" class="icon-btn" title="返回">←</button>
        </div>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <div class="section-title"><span>账户</span></div>
        <label class="field">
          <span>API Key</span>
          <div class="key-row">
            <input id="set-api-key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
            <button id="btn-toggle-key" class="mini-btn" type="button">显示</button>
          </div>
        </label>
        <div class="row">
          <button id="btn-test" class="mini-btn" type="button">测试连接</button>
          <span id="test-result" class="test-result"></span>
        </div>
        </div>
        <div class="settings-section">
          <div class="section-title"><span>刷新与提醒</span></div>
        <label class="field">
          <span>刷新间隔</span>
          <select id="set-interval">
            <option value="10000">10 秒</option>
            <option value="30000">30 秒</option>
            <option value="60000">1 分钟</option>
            <option value="300000">5 分钟</option>
            <option value="900000">15 分钟</option>
            <option value="1800000">30 分钟</option>
            <option value="3600000">1 小时</option>
          </select>
        </label>
        <label class="field">
          <span>低余额阈值（¥）</span>
          <input id="set-threshold" type="number" min="0" step="1" />
        </label>
        </div>
        <div class="settings-section">
          <div class="section-title"><span>外观与行为</span></div>
        <label class="field">
          <span>主题</span>
          <select id="set-theme">
            <option value="dark">深色</option>
            <option value="light">浅色</option>
          </select>
        </label>
        <div class="row">
          <label class="check"><input id="set-ontop" type="checkbox" /> 窗口置顶</label>
          <label class="check"><input id="set-autostart" type="checkbox" /> 开机自启</label>
        </div>
        </div>
        <div class="settings-section">
          <div class="section-title">
            <span>动效参数</span>
            <button id="btn-cloth-reset" class="mini-btn reset-btn" type="button">恢复默认</button>
          </div>
        <div class="row wind-row">
          <label class="check"><input id="set-wind" type="checkbox" /> 风效</label>
          <input id="set-clothWind" type="range" min="0" max="2" step="0.05" value="1" data-digits="2" />
          <em id="val-clothWind" class="range-val">1.00</em>
        </div>
        <div class="row">
          <label class="check"><input id="set-crease" type="checkbox" /> 褶皱折痕阴影</label>
        </div>
          <label class="field slider-field">
            <span>褶皱幅度 <em id="val-clothFold" class="range-val">0.03</em></span>
            <input id="set-clothFold" type="range" min="0" max="0.12" step="0.005" value="0.03" data-digits="3" />
          </label>
          <label class="field slider-field">
            <span>重力 <em id="val-clothGravity" class="range-val">0.07</em></span>
            <input id="set-clothGravity" type="range" min="0" max="0.3" step="0.005" value="0.07" data-digits="3" />
          </label>
          <label class="field slider-field">
            <span>空气阻力 <em id="val-clothAirDrag" class="range-val">0.004</em></span>
            <input id="set-clothAirDrag" type="range" min="0" max="0.02" step="0.001" value="0.004" data-digits="3" />
          </label>
          <label class="field slider-field">
            <span>回弹阻尼 <em id="val-clothDamping" class="range-val">0.985</em></span>
            <input id="set-clothDamping" type="range" min="0.9" max="1" step="0.005" value="0.985" data-digits="3" />
          </label>
          <label class="field slider-field">
            <span>拖拽滞后 <em id="val-clothDragLag" class="range-val">0.02</em></span>
            <input id="set-clothDragLag" type="range" min="0" max="0.06" step="0.002" value="0.02" data-digits="3" />
          </label>
          <label class="field slider-field">
            <span>惯性 <em id="val-clothInertia" class="range-val">0.45</em></span>
            <input id="set-clothInertia" type="range" min="0" max="1.2" step="0.05" value="0.45" data-digits="2" />
          </label>
          <label class="field slider-field">
            <span>褶皱深度上限 <em id="val-clothZMax" class="range-val">10</em></span>
            <input id="set-clothZMax" type="range" min="2" max="30" step="1" value="10" data-digits="0" />
          </label>
          <label class="field slider-field">
            <span>捏起收拢 <em id="val-clothPinchPull" class="range-val">0.13</em></span>
            <input id="set-clothPinchPull" type="range" min="0" max="0.4" step="0.01" value="0.13" data-digits="2" />
          </label>
          <label class="field slider-field">
            <span>捏起隆起 <em id="val-clothPinchLift" class="range-val">0.12</em></span>
            <input id="set-clothPinchLift" type="range" min="0" max="0.4" step="0.01" value="0.12" data-digits="2" />
          </label>
          <label class="field slider-field">
            <span>抓点隆起 <em id="val-clothPinchZ" class="range-val">8</em></span>
            <input id="set-clothPinchZ" type="range" min="0" max="20" step="0.5" value="8" data-digits="1" />
          </label>
          <label class="field slider-field">
            <span>网格密度 <em id="val-clothDensity" class="range-val">20</em></span>
            <input id="set-clothDensity" type="range" min="16" max="48" step="1" value="20" data-digits="0" />
          </label>
        </div>
        <div class="row actions">
          <button id="btn-save" class="primary-btn" type="button">保存</button>
          <button id="btn-reset" class="ghost-btn" type="button">清除 Key</button>
        </div>
      </div>
    </div>

    <div id="dot" class="dot hidden">
      <span id="dot-balance" class="dot-balance">¥</span>
    </div>

    <div id="mini" class="mini hidden">
      <div class="mini-main">
        <div id="mini-balance" class="mini-balance">--</div>
        <div id="mini-status" class="mini-status">未配置 API Key</div>
      </div>
      <div class="mini-actions">
        <div class="mode-switch">
          <button id="btn-mode-mini" class="icon-btn" title="切换形态">▾</button>
          <div id="mode-menu-mini" class="mode-menu hidden">
            <button type="button" data-action="settings">设置</button>
            <button type="button" data-mode="card">大卡片</button>
            <button type="button" data-mode="mini">迷你卡</button>
            <button type="button" data-mode="dot">圆点</button>
          </div>
        </div>
      </div>
    </div>
    <canvas id="cloth-canvas" aria-hidden="true"></canvas>
  </div>
  <script src="cloth.js"></script>
  <script src="app.js"></script>
</body>
</html>
